engine:
  dt: 3600
  max_steps: 10000
  central_mass: 1.989e30

permissions:
  allow_external_updates: false
  allow_data_persistence: true

simulation:
  objects:
    - id: SUN
      name: Sun
      mass: 1.989e30
      position: [0, 0, 0]
      velocity: [0, 0, 0]
      radius: 6.96e8
      color: yellow
    
    - id: EARTH
      name: Earth
      mass: 5.972e24
      position: [1.496e11, 0, 0]
      velocity: [0, 29780, 0]
      radius: 6.371e6
      color: dodgerblue

visualization:
  enabled: true
  interval_ms: 30

output:
  save_state: true
  format: json
  filename: output/state_snapshot.json
